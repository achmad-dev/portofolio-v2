name: Sync Medium
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: medium-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements-sync.txt
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/sync_medium.py
        env:
          MEDIUM_USERNAME: ${{ vars.MEDIUM_USERNAME }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: client
      - run: bun run test && bun run typecheck && bun run build && bun run verify:build
        working-directory: client
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://achmadalfazari.my.id' }}
      - name: Commit managed articles
        id: commit
        run: |
          git add -- client/src/content/blog/*.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'content: synchronize Medium articles'
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.sync.outputs.sha }}
